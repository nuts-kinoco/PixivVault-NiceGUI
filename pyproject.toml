[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "pixivvault-nicegui"
version = "0.1.0a0"
description = "PixivVaultの段階移植用NiceGUIデモ"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["nicegui==3.18.0", "Pillow==13.0.0", "cryptography==50.0.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "numpy==2.3.5"]
browser = ["playwright==1.64.0"]
video = ["numpy==2.3.5", "opencv-python==5.0.0.93"]
# Select exactly one ORT package in a dedicated environment, never both.
inference-cpu = ["numpy==2.3.5", "onnxruntime==1.28.0"]
inference-gpu = ["numpy==2.3.5", "onnxruntime-gpu[cuda,cudnn]==1.28.0"]
native = [
    "pywebview==6.2.1",
    "pystray==0.19.5; sys_platform == 'win32'",
    "win11toast==0.36.3; sys_platform == 'win32'",
    "numpy==2.3.5",
    "opencv-python==5.0.0.93",
]
build = ["pyinstaller==6.22.3"]

[project.scripts]
pixivvault-nicegui = "pixivvault_nicegui.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
pixivvault_nicegui = ["ui/*.css", "ui/*.js"]
