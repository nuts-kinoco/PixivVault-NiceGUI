name: migration-bootstrap

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run actual pytest collection
        run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - name: Check source syntax
        run: python -m compileall -q src tests
      - name: Report bootstrap metadata
        run: python -m pixivvault_nicegui --check

  browser:
    # ブランチpushとPRの二重実行を避け、実ブラウザはPR/mainで1回ずつ検証する。
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated browser test dependencies
        run: python -m pip install -e ".[test,browser]"
      - name: Install Chromium for this job
        run: python -m playwright install --with-deps chromium
      - name: Check real gallery, learning and image failure interactions
        run: python tools/run_browser_checks.py --channel chromium --output artifacts/browser-ci
      - name: Check synthetic learning persistence, recovery and session conflicts
        run: python tools/check_learning_persistence_browser.py --channel chromium --output artifacts/browser-ci/learning-persistence
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-evidence
          path: |
            artifacts/browser-ci/**/*.png
            artifacts/browser-ci/**/*.json
          retention-days: 7
