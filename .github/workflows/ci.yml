name: migration-bootstrap

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run actual pytest collection
        run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - name: Check source syntax
        run: python -m compileall -q src tests
      - name: Report bootstrap metadata
        run: python -m pixivvault_nicegui --check

  browser:
    # ブランチpushとPRの二重実行を避け、実ブラウザはPR/mainで1回ずつ検証する。
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated browser test dependencies
        run: python -m pip install -e ".[test,browser]"
      - name: Use canonical Ubuntu archive for browser system dependencies
        # The hosted Azure mirror stalled before any browser test ran.
        # Keep all dependencies and checks; only change the package mirror.
        run: |
          # Hosted runners may use mirror+file:/etc/apt/apt-mirrors.txt;
          # editing only sources.list leaves its HTTP Azure URL untouched.
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
      - name: Install Chromium for this job
        run: python -m playwright install --with-deps chromium
      - name: Check real gallery, learning, library and image failure interactions
        run: python tools/run_browser_checks.py --channel chromium --output artifacts/browser-ci
      - name: Check synthetic learning persistence, recovery and session conflicts
        run: python tools/check_learning_persistence_browser.py --channel chromium --output artifacts/browser-ci/learning-persistence
      - name: Check read-only legacy SQLite and saved images
        run: python tools/check_readonly_library_browser.py --channel chromium --output artifacts/browser-ci/readonly-library
      - name: Check authenticated bookmark UI through actual reader and synthetic Next.js transport
        run: python tools/check_live_bookmark_browser.py --channel chromium --identity-format next --output artifacts/browser-ci/live-bookmarks
      - name: Check legacy failure records, filtered CSV and recovery
        run: python tools/check_failed_records_browser.py --channel chromium --output artifacts/browser-ci/failed-records
      - name: Check synthetic download saves, durable queue and batch controls
        run: python tools/check_download_jobs_browser.py --channel chromium --output artifacts/browser-ci/download-jobs
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-evidence
          path: |
            artifacts/browser-ci/**/*.png
            artifacts/browser-ci/**/*.json
          retention-days: 7
